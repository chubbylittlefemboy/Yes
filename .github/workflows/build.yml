name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: unzip -o OverlayApp.zip
      - name: Fix compile error
        run: sed -i -e '/val L = WindowManager.LayoutParams/d' -e 's/\bL\./WindowManager.LayoutParams./g' OverlayApp/app/src/main/java/com/example/overlay/OverlayService.kt
      - run: cd OverlayApp && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: overlay-apk
          path: OverlayApp/app/build/outputs/apk/debug/app-debug.apk
